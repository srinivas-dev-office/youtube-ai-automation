<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgChibi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgChibi)"/>
  <!-- Sparkles -->
  <polygon points="80,50 85,60 95,65 85,70 80,80 75,70 65,65 75,60" fill="#ffffff" opacity="0.8"/>
  <polygon points="320,80 325,90 335,95 325,100 320,110 315,100 305,95 315,90" fill="#ffffff" opacity="0.8"/>
  <!-- Oversized Chibi Head (Giant head, tiny body) -->
  <ellipse cx="200" cy="120" rx="75" ry="65" fill="#fef08a"/>
  <!-- Giant Sparkly Chibi Eyes -->
  <ellipse cx="170" cy="125" rx="18" ry="24" fill="#1e1b4b"/>
  <ellipse cx="230" cy="125" rx="18" ry="24" fill="#1e1b4b"/>
  <circle cx="166" cy="116" r="8" fill="#ffffff"/>
  <circle cx="226" cy="116" r="8" fill="#ffffff"/>
  <circle cx="174" cy="132" r="4" fill="#ffffff"/>
  <circle cx="234" cy="132" r="4" fill="#ffffff"/>
  <!-- Blushing Cheeks -->
  <ellipse cx="150" cy="145" rx="12" ry="6" fill="#f43f5e" opacity="0.6"/>
  <ellipse cx="250" cy="145" rx="12" ry="6" fill="#f43f5e" opacity="0.6"/>
  <!-- Tiny Cute Mouth -->
  <path d="M192 145 Q200 152 208 145" stroke="#be123c" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Cute Hair Buns -->
  <circle cx="130" cy="70" r="28" fill="#d97706"/>
  <circle cx="270" cy="70" r="28" fill="#d97706"/>
  <!-- Tiny Chibi Body -->
  <path d="M180 185 L170 260 L230 260 L220 185 Z" fill="#ec4899"/>
  <circle cx="155" cy="220" r="12" fill="#fef08a"/>
  <circle cx="245" cy="220" r="12" fill="#fef08a"/>
  <!-- Style Label -->
  <rect x="20" y="20" width="110" height="28" rx="6" fill="#0b1220" opacity="0.85"/>
  <text x="32" y="38" fill="#f472b6" font-family="Inter, sans-serif" font-size="12" font-weight="700">CHIBI STYLE</text>
</svg>