<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#18181b"/>
  <!-- Pixel Grid Pattern -->
  <g fill="#22c55e" opacity="0.1">
    <rect x="0" y="0" width="20" height="20"/>
    <rect x="40" y="0" width="20" height="20"/>
    <rect x="80" y="40" width="20" height="20"/>
    <rect x="300" y="60" width="20" height="20"/>
  </g>
  <!-- 16-Bit Pixel Art Character (Constructed with chunky pixel blocks) -->
  <g transform="translate(140, 50) scale(7)">
    <!-- Helmet/Hair -->
    <rect x="5" y="0" width="6" height="2" fill="#ef4444"/>
    <rect x="4" y="2" width="8" height="2" fill="#ef4444"/>
    <!-- Face -->
    <rect x="4" y="4" width="8" height="4" fill="#fed7aa"/>
    <!-- Eyes -->
    <rect x="5" y="5" width="2" height="2" fill="#1e293b"/>
    <rect x="9" y="5" width="2" height="2" fill="#1e293b"/>
    <!-- Moustache -->
    <rect x="5" y="7" width="6" height="1" fill="#78350f"/>
    <!-- Body -->
    <rect x="4" y="8" width="8" height="6" fill="#3b82f6"/>
    <rect x="6" y="8" width="4" height="6" fill="#ef4444"/>
    <!-- Arms -->
    <rect x="2" y="9" width="2" height="4" fill="#ef4444"/>
    <rect x="12" y="9" width="2" height="4" fill="#ef4444"/>
    <rect x="1" y="12" width="3" height="2" fill="#fed7aa"/>
    <rect x="12" y="12" width="3" height="2" fill="#fed7aa"/>
    <!-- Legs -->
    <rect x="4" y="14" width="3" height="4" fill="#1e3a8a"/>
    <rect x="9" y="14" width="3" height="4" fill="#1e3a8a"/>
    <rect x="3" y="17" width="4" height="2" fill="#78350f"/>
    <rect x="9" y="17" width="4" height="2" fill="#78350f"/>
  </g>
  <!-- Style Label -->
  <rect x="20" y="20" width="130" height="28" rx="6" fill="#0b1220" opacity="0.85"/>
  <text x="32" y="38" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">16-BIT PIXEL ART</text>
</svg>