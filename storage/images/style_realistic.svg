<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgReal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="60%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="goldCrown" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgReal)"/>
  <circle cx="200" cy="90" r="120" fill="url(#sunGlow)"/>
  <!-- Mountain & Trees background -->
  <path d="M0 260 L80 180 L160 250 L250 150 L340 240 L400 200 L400 300 L0 300 Z" fill="#0f172a" opacity="0.6"/>
  <!-- Realistic Warrior Silhouette -->
  <path d="M140 300 C140 240 160 210 200 210 C240 210 260 240 260 300 Z" fill="#1e293b"/>
  <!-- Torso & Saffron Silk -->
  <path d="M165 240 Q200 260 235 240 L240 300 L160 300 Z" fill="#ea580c"/>
  <!-- Neck & Head -->
  <path d="M185 185 L185 215 L215 215 L215 185 Z" fill="url(#skinGrad)"/>
  <ellipse cx="200" cy="150" rx="35" ry="45" fill="url(#skinGrad)"/>
  <!-- Crown / Mukut -->
  <polygon points="170,120 200,60 230,120 215,125 200,105 185,125" fill="url(#goldCrown)"/>
  <circle cx="200" cy="95" r="5" fill="#ef4444"/>
  <!-- Eyes & Facial features -->
  <ellipse cx="188" cy="148" rx="5" ry="3" fill="#ffffff"/>
  <circle cx="189" cy="148" r="2.5" fill="#0f172a"/>
  <ellipse cx="212" cy="148" rx="5" ry="3" fill="#ffffff"/>
  <circle cx="211" cy="148" r="2.5" fill="#0f172a"/>
  <!-- Tilak -->
  <path d="M198 128 L202 128 L200 142 Z" fill="#fef08a"/>
  <!-- Golden Bow Arc -->
  <path d="M145 100 Q120 180 150 270" stroke="url(#goldCrown)" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- Style Label -->
  <rect x="20" y="20" width="130" height="28" rx="6" fill="#0b1220" opacity="0.85"/>
  <text x="32" y="38" fill="#60a5fa" font-family="Inter, sans-serif" font-size="12" font-weight="700">REALISTIC CINEMATIC</text>
</svg>