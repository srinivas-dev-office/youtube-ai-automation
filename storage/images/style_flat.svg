<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#0f766e"/>
  <!-- Geometric shapes background -->
  <polygon points="0,0 200,0 100,150" fill="#14b8a6" opacity="0.3"/>
  <polygon points="250,150 400,50 400,250" fill="#2dd4bf" opacity="0.2"/>
  <!-- Geometric Minimalist Character -->
  <circle cx="200" cy="110" r="45" fill="#fde047"/>
  <polygon points="150,155 250,155 280,300 120,300" fill="#0369a1"/>
  <!-- Flat Vector Sunglasses / Eyes -->
  <rect x="170" y="105" width="25" height="12" rx="3" fill="#0f172a"/>
  <rect x="205" y="105" width="25" height="12" rx="3" fill="#0f172a"/>
  <line x1="195" y1="111" x2="205" y2="111" stroke="#0f172a" stroke-width="4"/>
  <!-- Geometric Tie / Scarf -->
  <polygon points="190,155 210,155 205,230 200,245 195,230" fill="#ef4444"/>
  <!-- Style Label -->
  <rect x="20" y="20" width="140" height="28" rx="6" fill="#0b1220" opacity="0.85"/>
  <text x="32" y="38" fill="#2dd4bf" font-family="Inter, sans-serif" font-size="12" font-weight="700">FLAT &amp; GEOMETRIC</text>
</svg>