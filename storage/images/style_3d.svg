<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg3D)"/>
  <!-- 3D Low-Poly Polygonal Mesh Character -->
  <!-- Low poly head facets -->
  <polygon points="200,60 160,110 200,100" fill="#a5b4fc"/>
  <polygon points="200,60 200,100 240,110" fill="#c7d2fe"/>
  <polygon points="160,110 200,100 170,160" fill="#818cf8"/>
  <polygon points="200,100 240,110 230,160" fill="#6366f1"/>
  <polygon points="200,100 170,160 200,180" fill="#4f46e5"/>
  <polygon points="200,100 230,160 200,180" fill="#4338ca"/>
  <!-- Eyes -->
  <polygon points="175,120 185,125 180,135" fill="#ffffff"/>
  <polygon points="225,120 215,125 220,135" fill="#ffffff"/>
  <!-- Low poly torso facets -->
  <polygon points="200,180 140,230 200,240" fill="#f59e0b"/>
  <polygon points="200,180 200,240 260,230" fill="#fbbf24"/>
  <polygon points="140,230 200,240 160,300" fill="#d97706"/>
  <polygon points="200,240 260,230 240,300" fill="#b45309"/>
  <polygon points="200,240 160,300 200,300" fill="#92400e"/>
  <polygon points="200,240 200,300 240,300" fill="#78350f"/>
  <!-- Style Label -->
  <rect x="20" y="20" width="130" height="28" rx="6" fill="#0b1220" opacity="0.85"/>
  <text x="32" y="38" fill="#818cf8" font-family="Inter, sans-serif" font-size="12" font-weight="700">3D / LOW-POLY</text>
</svg>